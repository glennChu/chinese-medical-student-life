<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一个中国医学生的一生</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="start-screen" class="card">
        <h1>一个中国医学生的一生</h1>
        <p class="intro">点击选项推进剧情：从 985 医学院报到到职业终局，每次选择都会改变你的属性、路径与结局。经济状况改为 0–100 百分制，关键行动会有判定、后果链、财务危机与科室分化。</p>
        <p id="disclaimer-text" class="disclaimer"></p>
        <section class="settings-panel" aria-labelledby="settings-title">
          <h2 id="settings-title" class="settings-title">内容与原型设置</h2>
          <label class="setting-toggle" for="historical-events-toggle">
            <input id="historical-events-toggle" type="checkbox" />
            <span>历史原型事件（含真实人物姓名）— 可关闭为虚构化版本</span>
          </label>
          <p class="settings-note">提示：相关剧情默认关闭真实姓名版本，开启后仍为克制、尊重的历史原型表达；部分结局会明确标注架空/虚构边界。</p>
        </section>
        <div class="btn-row">
          <button id="start-btn" type="button">开始新人生</button>
          <button id="continue-btn" type="button">继续游戏</button>
          <button id="clear-btn" type="button" class="danger">清除存档</button>
        </div>
      </section>

      <section id="game-screen" class="layout" hidden>
        <article class="card event-card" aria-live="polite">
          <div id="timeline-banner" class="timeline-banner">医学生涯第 1 年 · 18 岁</div>
          <header class="event-meta">
            <span id="stage-tag" class="tag"></span>
            <span id="age-tag" class="tag"></span>
            <span id="timeline-tag" class="tag"></span>
            <span id="specialty-tag" class="tag"></span>
            <span id="chapter-tag" class="tag chapter-tag" hidden></span>
            <span id="regional-tag" class="tag chapter-tag regional-tag" hidden></span>
            <span id="origin-tag" class="tag"></span>
          </header>
          <div id="outcome-card" class="outcome-card" hidden aria-live="polite">
            <span id="outcome-label" class="outcome-label"></span>
            <p id="outcome-text" class="outcome-text"></p>
          </div>
          <div class="title-row">
            <h2 id="event-title"></h2>
            <span id="major-tag" class="tag major-tag" hidden aria-label="当前为重大抉择事件">重大抉择</span>
          </div>
          <p id="event-text" class="event-text"></p>
          <div id="change-feedback" class="feedback" aria-live="polite"></div>
          <div id="options" class="options" role="group" aria-label="剧情选项"></div>
          <button id="reset-btn" type="button" class="ghost">重新开始</button>
        </article>

        <aside class="side-panel">
          <section class="card resume-card" id="resume-card" aria-labelledby="resume-title" hidden>
            <h3 id="resume-title">当前履历档案</h3>
            <ul id="resume-list" class="resume-list"></ul>
          </section>

          <section class="card" aria-labelledby="stats-title">
            <h3 id="stats-title">属性面板</h3>
            <ul id="stats" class="stats-list"></ul>
          </section>

          <section class="card" aria-labelledby="log-title">
            <h3 id="log-title">人生病历（关键日志）</h3>
            <ol id="log-list" class="log-list"></ol>
          </section>
        </aside>
      </section>

      <section id="ending-screen" class="card" hidden>
        <h2 id="ending-title"></h2>
        <p id="ending-text" class="event-text"></p>
        <h3>关键统计</h3>
        <ul id="ending-stats" class="stats-list"></ul>
        <h3>已解锁结局</h3>
        <p id="unlocked-endings" class="summary"></p>
        <h3>已解锁成就</h3>
        <p id="unlocked-achievements" class="summary"></p>
        <button id="restart-from-ending" type="button">再来一局</button>
      </section>
    </main>

    <script src="events.js"></script>
    <script src="check-system.js"></script>
    <script src="game.js"></script>
  </body>
</html>
